# /etc/nginx/conf.d/eeefut-dashboard.conf  (installed after Let's Encrypt)
#
# :80  IP        → dashboard (http)
# :80  eeefut.com / www → https://eeefut.com
# :443 eeefut.com / www → dashboard

upstream eeefut_dashboard {
    server 127.0.0.1:8082;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/certbot;
    }

    location = /health {
        access_log off;
        proxy_pass http://eeefut_dashboard/health;
    }

    location / {
        proxy_pass http://eeefut_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name eeefut.com www.eeefut.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/certbot;
    }

    location / {
        return 301 https://eeefut.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eeefut.com www.eeefut.com;

    ssl_certificate     /etc/letsencrypt/live/eeefut.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eeefut.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20M;

    location = /health {
        access_log off;
        proxy_pass http://eeefut_dashboard/health;
    }

    location / {
        proxy_pass http://eeefut_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}
