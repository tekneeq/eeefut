# /etc/nginx/conf.d/eeefut-dashboard.conf
#
# This instance is eeefut-only. Nginx :80 → the dashboard container on :8082
# (same shape as julia's port-80 proxy on its own box).
#
# Amazon Linux also ships a stock ``server { listen 80; }`` in nginx.conf.
# Run scripts/install-nginx-80.sh once to disable that and start nginx.
#
# Deploy with:
#   ./scripts/install-nginx-80.sh

upstream eeefut_dashboard {
    server 127.0.0.1:8082;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    location = /health {
        access_log off;
        proxy_pass http://eeefut_dashboard/health;
    }

    location / {
        proxy_pass http://eeefut_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}
