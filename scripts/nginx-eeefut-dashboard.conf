# /etc/nginx/conf.d/eeefut-dashboard.conf
#
# Port 80 front door → dashboard containers on this box:
#   /          → eeefut  127.0.0.1:8082
#   /eeefut/   → eeefut  127.0.0.1:8082
#   /eeesoc/   → eeesoc  127.0.0.1:8081
#   /julia/    → julia   127.0.0.1:8501
#
# Julia's stock config also claims ``listen 80 default_server``. Only one
# default_server can bind :80 — run scripts/install-nginx-80.sh once so
# this file owns 80 and julia is still reachable at /julia/.
#
# Deploy with:
#   ./scripts/install-nginx-80.sh
#   # or:
#   sudo cp scripts/nginx-eeefut-dashboard.conf /etc/nginx/conf.d/eeefut-dashboard.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream eeefut_dashboard {
    server 127.0.0.1:8082;
}

upstream eeesoc_dashboard {
    server 127.0.0.1:8081;
}

upstream julia_dashboard {
    server 127.0.0.1:8501;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    location = /health {
        access_log off;
        proxy_pass http://eeefut_dashboard/health;
    }

    location = /dashboards {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>dashboards</title><body style="font:16px/1.4 system-ui;background:#07090c;color:#e7efe9;padding:2rem"><h1>dashboards</h1><ul><li><a href="/" style="color:#7dffb3">eeefut</a> — NFL :8082</li><li><a href="/eeesoc/" style="color:#7dffb3">eeesoc</a> — soccer :8081</li><li><a href="/julia/" style="color:#7dffb3">julia</a> — options :8501</li></ul></body>';
    }

    location /eeefut/ {
        proxy_pass http://eeefut_dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }

    location /eeesoc/ {
        proxy_pass http://eeesoc_dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }

    location /julia/ {
        proxy_pass http://julia_dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://eeefut_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}
