# /etc/nginx/conf.d/eeefut-dashboard.conf
#
# Nginx reverse-proxies http://<host>:8083 → the eeefut dashboard at 127.0.0.1:8082.
#
# Port map on the shared julia / eeesoc box:
#   julia   :80  → 127.0.0.1:8501
#   eeesoc  :8080 → 127.0.0.1:8081
#   eeefut  :8083 → 127.0.0.1:8082
#
# Deploy with:
#   sudo cp scripts/nginx-eeefut-dashboard.conf /etc/nginx/conf.d/eeefut-dashboard.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8083 default_server;
    listen [::]:8083 default_server;
    server_name _;

    client_max_body_size 20M;

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8082/health;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}

