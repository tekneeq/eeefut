# Redeploy the dashboard on this instance whenever ``main`` advances.
# Same SSH pattern as tekneeq/julia and tekneeq/eeesoc — each app has
# its own EC2 box, so EC2_HOST here must be the eeefut instance.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST            public IP or DNS of the instance
#   EC2_USER            SSH user (usually ``ec2-user`` on Amazon Linux)
#   EC2_SSH_PRIVATE_KEY full PEM private key that can SSH as EC2_USER
# Optional:
#   EC2_SSH_PORT        default 22
#   EC2_APP_DIR         default ``/home/ec2-user/eeefut``
#
# The EC2 security group must allow inbound SSH from GitHub Actions
# (or temporarily 0.0.0.0/0 on :22). See README "Auto-deploy on push".

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual "Run workflow" button

concurrency:
  group: deploy-ec2
  cancel-in-progress: false  # never cut a mid-deploy rebuild short

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/eeefut"
            fi
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git checkout."
              echo "One-time bootstrap on the box:"
              echo "  git clone https://github.com/tekneeq/eeefut.git $APP_DIR"
              echo "  cd $APP_DIR && ./deploy.sh"
              exit 1
            fi
            cd "$APP_DIR"
            # Pull first so deploy.sh / restart.sh from this push are what we run.
            git pull --ff-only origin main
            chmod +x deploy.sh restart.sh scripts/docker-entrypoint.sh
            ./deploy.sh
