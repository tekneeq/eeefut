# One-shot SSH diagnostics for the eeefut dashboard box (no rebuild).
name: EC2 status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Container / git / health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 8m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="$HOME/eeefut"; fi
            cd "$APP_DIR"
            echo "=== host time ==="
            date
            echo "=== container ==="
            docker ps --filter name=eeefut-dashboard --format '{{.Names}} {{.Status}} {{.Image}}'
            echo "=== git ==="
            git rev-parse --short HEAD
            git log -1 --format='%h %ci %s'
            echo "=== health :8082 ==="
            curl -fsS http://127.0.0.1:8082/health || echo "(container health failed)"
            echo "=== health :80 ==="
            curl -fsS http://127.0.0.1/health || echo "(nginx :80 health failed)"
            echo "=== meta via :80 ==="
            curl -fsS http://127.0.0.1/api/meta || true
            echo
            echo "=== recent container logs ==="
            docker logs --tail 60 eeefut-dashboard 2>&1 || true
            echo "=== cache ==="
            du -sh data/cache 2>/dev/null || echo "(no data/cache yet)"
            ls -la data/cache/seasons 2>/dev/null || true
